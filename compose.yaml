services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: waiting_room
      POSTGRES_USER: waiting_room
      POSTGRES_PASSWORD: waiting_room
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waiting_room -d waiting_room"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"

volumes:
  pgdata:
