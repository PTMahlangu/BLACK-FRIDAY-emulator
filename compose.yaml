services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: waiting_room
      POSTGRES_USER: waiting_room
      POSTGRES_PASSWORD: waiting_room
    ports:
      - "5433:5432"   # 5432 is taken by the host's PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"

volumes:
  pgdata:
