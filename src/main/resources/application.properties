spring.application.name=waiting_room

# --- Web ---------------------------------------------------------------
# 8080 is already taken on the dev machine
server.port=${PORT:8081}
# Virtual threads for request handling and @Scheduled tasks
spring.threads.virtual.enabled=true

# --- PostgreSQL (see compose.yaml) -------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/waiting_room}
spring.datasource.username=${DB_USERNAME:waiting_room}
spring.datasource.password=${DB_PASSWORD:waiting_room}
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Kafka (see compose.yaml) ------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Used by the shop-events stats listener. The queue gatekeeper uses its own group.
spring.kafka.consumer.group-id=black-friday-stats
spring.kafka.consumer.auto-offset-reset=latest

# --- Waiting room defaults (changeable at runtime from the dashboard) ---
blackfriday.admission-rate-per-second=20
blackfriday.store-capacity=200
blackfriday.session-seconds=30
