spring.application.name=waiting_room
server.port=${PORT:8085}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/waiting_room}
spring.datasource.username=${DB_USERNAME:waiting_room}
spring.datasource.password=${DB_PASSWORD:waiting_room}
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=black-friday-stats
spring.kafka.consumer.auto-offset-reset=latest

# Virtual threads for request handling
spring.threads.virtual.enabled=true

# Waiting room defaults (can be changed at runtime from the dashboard)
blackfriday.admission-rate-per-second=20
blackfriday.store-capacity=200
blackfriday.session-seconds=30
